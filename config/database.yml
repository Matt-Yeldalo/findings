default: &default
  adapter: sqlite3
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: solution_log_development

test:
  <<: *default
  database: solution_log_test

production:
  primary:
    <<: *default
    database: solution_log_production
    username: <%= ENV["DATABASE_USERNAME"] %>
    password: <%= ENV["DATABASE_PASSWORD"] %>
    host: <%= ENV.fetch("DATABASE_HOST") { "localhost" } %>
  cache:
    <<: *default
    database: solution_log_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: solution_log_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: solution_log_production_cable
    migrations_paths: db/cable_migrate
